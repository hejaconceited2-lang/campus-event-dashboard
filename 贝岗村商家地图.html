function colorOf(w){return w>=30?'#dc2626':w>=15?'#f59e0b':'#22c55e';}
function catOf(w){return w>=30?'高':w>=15?'中':'低';}
var layer=L.layerGroup().addTo(map);
function render(kw){
  layer.clearLayers();
  D.marks.forEach(function(m){
    if(kw && m.name.indexOf(kw)<0) return;
    var c=colorOf(m.w);
    var mk=L.circleMarker([m.lat,m.lng],{radius:7,color:'#fff',weight:1.5,fillColor:c,fillOpacity:.9}).addTo(layer);
    mk.bindPopup(
      '<div class="pop"><h4>'+m.name+(m.sd?' 🛵自配送':'')+'</h4>'
      +'<div class="m"><div><b>'+m.n+'</b>单量</div><div><b>'+m.w+'%</b>整单超时</div><div><b>'+m.p+'%</b>取餐段超时</div><div><b>'+m.wf+'</b>B端万服</div></div>'

  });
}
function fitAll(){map.fitBounds(layer.getBounds().pad(0.15));}
function fitCat(cat){
  var bs=[];
  layer.eachLayer(function(l){ if(l.getPopup&&l.getPopup()&&catOf((l.getPopup().getContent()||'').match(/<b>([\d.]+)%<\/b>整单/)[1])===cat) bs.push(l.getLatLng()); });
  if(bs.length) map.fitBounds(L.latLngBounds(bs).pad(0.3));
}
