    var wfRows=m.wf.length?m.wf.map(function(w){
      var b='<button class="wfbtn" onclick="showTL(\''+w[0]+'\',\''+w[5]+'\')">链路</button>';
      return '<tr><td>'+w[0].replace('2026-08-','8/')+'<br>'+w[1]+'</td><td style="text-align:left">'+esc(w[2])+'</td><td>'+w[4]+'</td><td>'+b+'</td></tr>';
    }).join(''):'<tr><td colspan="4" style="color:#94a3b8">无B端万服</td></tr>';
    var saved=localStorage.getItem(keyOf(m))||'';
    var vstat=saved?'<div class="vstat">✓ 已记录 '+saved.length+' 字</div>':'';
    h += '<details class="card"><summary><span class="nm">'+esc(m.name)+'</span>'
       + '<span class="bad b">'+m.n+'单</span><span class="bad '+wc+'">整超'+last.w+'%</span><span class="bad '+pc+'">取超'+last.p+'%</span></summary>'
       + '<div class="body">'
       + '<h3>📅 按日超时率（8/15-22 · 每天 单量/整单超时/取餐段超时）</h3>'
       + '<div class="wrap"><table><tr><th>日期</th><th>单量</th><th>整单超时%</th><th>取餐段超时%</th></tr>'+dayRows+'</table></div>'
       + '<h3>📋 B端万服（'+m.wf.length+'件 · 点「链路」看订单）</h3>'
       + '<div class="wrap"><table><tr><th>时间</th><th>事件</th><th>骑手</th><th>详情</th></tr>'+wfRows+'</table></div>'
       + '<h3>📝 走访记录（自动保存本机）</h3>'
       + '<textarea class="visit" data-k="'+keyOf(m)+'" placeholder="记录走访情况：卫生/证照/出餐速度/沟通…">'+esc(saved)+'</textarea>'
       + '<div style="margin-top:6px"><button class="vbtn" data-save="'+keyOf(m)+'">保存记录</button>'
       + '<button class="vbtn gy" data-clear="'+keyOf(m)+'">清空</button><span class="vstat"></span></div>'
       + '</div></details>';
  });
  document.getElementById('list').innerHTML=h || '<div class="empty">无匹配商家</div>';
  // 走访记录绑定
  document.querySelectorAll('[data-save]').forEach(function(b){b.onclick=function(){
    var k=b.getAttribute('data-save');
    var v=document.querySelector('textarea[data-k="'+k+'"]').value;
    localStorage.setItem(k,v);
    b.parentNode.querySelector('.vstat').textContent='✓ 已保存 '+v.length+' 字';
  };});
  document.querySelectorAll('[data-clear]').forEach(function(b){b.onclick=function(){
    var k=b.getAttribute('data-clear');
    localStorage.removeItem(k);
    document.querySelector('textarea[data-k="'+k+'"]').value='';
    b.parentNode.querySelector('.vstat').textContent='已清空';
  };});
  document.getElementById('sub').textContent='8/15-8/22 · 贝岗商家 '+D.n_active+' 家（含'+D.merchants.filter(function(x){return x.noorder;}).length+'家在线无单）· 停业/未在线 '+D.n_closed+' 家';
  document.getElementById('ft').textContent='整单超时=总时长>60min ｜ 取餐段超时=下单→取餐>20min ｜ 万服=B端商家进线 ｜ 数据 8/15-8/22';
}
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
  t.classList.add('on'); sortKey=t.getAttribute('data-k'); render();
}});
document.getElementById('q').addEventListener('input',function(){q=this.value;render();});
render();
</script></body></html>
