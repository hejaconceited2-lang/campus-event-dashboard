*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#f1f5f9;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;color:#0f172a}
.hd{position:sticky;top:0;background:#4f46e5;color:#fff;padding:12px 16px 8px;z-index:30}
.hd h1{font-size:18px;font-weight:800}
.hd .sub{font-size:11.5px;opacity:.85;margin-top:1px}
.tabs{display:flex;gap:8px;margin-top:9px}
.tab{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:rgba(255,255,255,.16);font-size:13.5px;font-weight:700}
.tab.on{background:#fff;color:#4f46e5}
.stabs{display:none;gap:6px;margin-top:7px;overflow-x:auto;padding-bottom:2px}
.stabs .s{flex:1;min-width:70px;padding:6px 0;border-radius:8px;background:rgba(255,255,255,.14);font-size:12px}
.stabs.on{display:flex}
.srch{margin:10px 16px 0;display:flex;gap:8px}
.srch input{flex:1;padding:9px 12px;border-radius:10px;border:1px solid #cbd5e1;font-size:14px;background:#fff}
.expbtn{margin:10px 16px 0;padding:9px 0;width:100%;border:none;border-radius:10px;background:#0d9488;color:#fff;font-size:13.5px;font-weight:700;cursor:pointer}
.cnt{padding:10px 12px 60px}
.card{background:#fff;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(2,6,23,.07);overflow:hidden}
.card summary{list-style:none;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.card summary::-webkit-details-marker{display:none}
.card[open] summary{background:#f8fafc}
.nm{flex:1;font-weight:700;font-size:14px;line-height:1.35}
.bad{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.bad.r{background:#fee2e2;color:#b91c1c}.bad.y{background:#fef3c7;color:#b45309}.bad.g{background:#dcfce7;color:#15803d}.bad.b{background:#dbeafe;color:#1d4ed8}.bad.gy{background:#f1f5f9;color:#64748b}
.body{padding:10px 14px 14px;border-top:1px solid #f1f5f9}
h3{font-size:13px;font-weight:700;margin:10px 0 6px;color:#334155}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th,td{padding:4px 5px;text-align:center;border-bottom:1px solid #f1f5f9;white-space:nowrap}
th{color:#64748b;font-weight:600}
.slow{color:#dc2626;font-weight:700}
.wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:8px}
.wfbtn{padding:2px 8px;border:none;border-radius:6px;background:#eef2ff;color:#4338ca;font-size:11px;cursor:pointer}
.mapbtn{padding:3px 9px;border:none;border-radius:8px;background:#eef2ff;color:#4f46e5;font-size:11.5px;font-weight:700;cursor:pointer}
.visit{width:100%;min-height:56px;border:1px solid #cbd5e1;border-radius:8px;padding:8px;font-size:13px;font-family:inherit;background:#fffbeb}
.vbtn{margin-top:6px;padding:6px 14px;border:none;border-radius:8px;background:#4f46e5;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
.vbtn.gy{background:#e2e8f0;color:#475569;margin-left:8px}
.vstat{font-size:11px;color:#16a34a;margin-top:4px}
.closed{margin-top:14px}
.closed summary{list-style:none;cursor:pointer;padding:10px;background:#fff;border-radius:10px;font-weight:600;color:#64748b}
#map{height:calc(100vh - 138px);margin:10px 12px;border-radius:14px;overflow:hidden;z-index:1}
#mapView{display:none}
.lgc{position:fixed;z-index:500;right:22px;bottom:80px;display:flex;flex-direction:column;gap:4px}
.lgc .b{padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer;border:1px solid #e2e8f0}
.pop{min-width:200px}
.pop h4{font-size:14px;margin-bottom:4px}
.pop .m{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px;margin:6px 0}
.pop .m b{display:block;font-size:14px}
.pop a{display:block;text-align:center;padding:6px;background:#4f46e5;color:#fff;border-radius:8px;text-decoration:none;font-size:12.5px;font-weight:600}
.legend{position:fixed;left:22px;bottom:14px;z-index:500;background:#fff;border-radius:9px;padding:6px 10px;font-size:11px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}
#modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:60;padding:12px;overflow:auto}
#modal .box{background:#fff;max-width:640px;margin:20px auto;border-radius:14px;padding:16px;position:relative}
#modal .close{position:absolute;right:12px;top:10px;border:none;background:#f1f5f9;font-size:15px;padding:4px 10px;border-radius:8px;cursor:pointer}
#mtl{font-size:12px}
.ft{color:#94a3b8;font-size:11px;text-align:center;margin-top:14px}
.empty{color:#94a3b8;text-align:center;padding:24px}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function keyOf(m){return 'bgvisit_'+m.name;}

// ---- tab 切换 ----
function switchTab(v){
  document.getElementById('mapView').style.display = v==='map'?'block':'none';
  document.getElementById('visitView').style.display = v==='map'?'none':'block';
  document.getElementById('tabMap').classList.toggle('on', v==='map');
  document.getElementById('tabVisit').classList.toggle('on', v!=='map');
  document.getElementById('stabs').classList.toggle('on', v!=='map');
  document.getElementById('q').placeholder = v==='map'?'🔍 搜索商家（地图定位）':'🔍 搜索商家';
  if(v==='map'){ if(!mapInit) initMap(); else setTimeout(function(){map.invalidateSize();},50); }
}
document.getElementById('tabMap').onclick=function(){switchTab('map');};
document.getElementById('tabVisit').onclick=function(){switchTab('visit');};
document.querySelectorAll('#stabs .s').forEach(function(t){t.onclick=function(){
  document.querySelectorAll('#stabs .s').forEach(function(x){x.classList.remove('on');});
  t.classList.add('on'); sortKey=t.getAttribute('data-k'); renderVisit();
};});

// ---- 地图 ----
function colorOf(w){return w>=30?'#dc2626':w>=15?'#f59e0b':'#22c55e';}
function catOf(w){return w>=30?'高':w>=15?'中':'低';}
var TILE_SRC=[
  ['https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:['1','2','3','4']}],
  ['https://tile.openstreetmap.org/{z}/{x}/{y}.png',{}],
  ['https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:['a','b','c','d']}]
];
function initMap(){
  mapInit=true;
  map=L.map('map',{zoomControl:false}).setView([23.0616,113.392],14);
  var ti=0;
  function addTile(i){
    if(i>=TILE_SRC.length) return;
    var t=L.tileLayer(TILE_SRC[i][0],Object.assign({maxZoom:18},TILE_SRC[i][1]));
    t.on('tileerror',function(){ if(i<TILE_SRC.length-1){ t.remove(); setTimeout(function(){addTile(i+1);},600); } });
    t.addTo(map);
  }
  addTile(0);
  cluster=L.markerClusterGroup({maxClusterRadius:40,showCoverageOnHover:false}).addTo(map);
  renderMap(q);
  setTimeout(function(){map.invalidateSize();},100);
}
function renderMap(kw){
  if(!cluster) return;
  cluster.clearLayers(); marksMap={};
  D.merchants.forEach(function(m){
    if(!m.lng) return;
    if(kw && m.name.indexOf(kw)<0) return;
    var mk=L.circleMarker([m.lat,m.lng],{radius:7,color:'#fff',weight:1.5,fillColor:colorOf(m.w),fillOpacity:.9});
    marksMap[m.name]=mk;
    mk.bindPopup('<div class="pop"><h4>'+esc(m.name)+'</h4>'
      +(m.src==='poi'?'<div style="font-size:11px;color:#b45309;margin-bottom:4px">📍 POI近似定位（走访时请核实）</div>':'')
      +'<div class="m"><div><b>'+m.n+'</b>单量</div><div><b>'+m.w+'%</b>整单超时</div><div><b>'+m.p+'%</b>取餐段超时</div><div><b>'+m.wf+'</b>B端万服</div></div>'
      +'<a href="#" onclick="gotoVisit(\''+encodeURIComponent(m.name)+'\');return false;">📋 去走访记录 →</a></div>');
    cluster.addLayer(mk);
  });
}
function fitAll(){ if(cluster&&cluster.getBounds().isValid()) map.fitBounds(cluster.getBounds().pad(0.15)); }
function fitCat(cat){
  var bs=[]; Object.keys(marksMap).forEach(function(n){var m=D.merchants.filter(function(x){return x.name===n;})[0]; if(m&&catOf(m.w)===cat) bs.push(marksMap[n].getLatLng());});
  if(bs.length) map.fitBounds(L.latLngBounds(bs).pad(0.3));
}
function focusMap(name){
  name=decodeURIComponent(name);
  switchTab('map');
  var m=D.merchants.filter(function(x){return x.name===name;})[0];
  if(!m||!m.lng){ alert('该商家无地图定位'); return; }
  if(!mapInit) initMap();
  setTimeout(function(){
    if(marksMap[name]){ map.setView([m.lat,m.lng],17); marksMap[name].openPopup(); }
    else { renderMap(''); map.setView([m.lat,m.lng],17); if(marksMap[name]) marksMap[name].openPopup(); }
  }, mapInit?80:500);
}

// ---- 走访视图 ----
function renderVisit(){
  var kw=q.trim();
  var list=D.merchants.filter(function(m){return !kw||m.name.indexOf(kw)>=0;});
  list.sort(function(a,b){return (b[sortKey]||0)-(a[sortKey]||0);});
  var h='';
  list.forEach(function(m){
    var last=m.days[m.days.length-1];
    var wc=last.w>=30?'r':last.w>=15?'y':'g';
    var pc=last.p>=30?'r':last.p>=15?'y':'g';
    var dayRows=m.days.map(function(dd){
      return '<tr><td>'+dd.d+'</td><td>'+dd.n+'</td><td class="'+(dd.w>=30?'slow':'')+'">'+(dd.w==null?'-':dd.w+'%')+'</td><td class="'+(dd.p>=30?'slow':'')+'">'+(dd.p==null?'-':dd.p+'%')+'</td></tr>';
    }).join('');
    var wfRows=m.wf_list.length?m.wf_list.map(function(w){
      return '<tr><td>'+w[0].replace('2026-08-','8/')+'<br>'+w[1]+'</td><td style="text-align:left">'+esc(w[2])+'</td><td>'+w[4]+'</td><td><button class="wfbtn" onclick="showTL(\''+w[0]+'\',\''+w[5]+'\')">链路</button></td></tr>';
    }).join(''):'<tr><td colspan="4" style="color:#94a3b8">无B端万服</td></tr>';
    var saved=localStorage.getItem(keyOf(m))||'';
    h += '<details class="card" id="card_'+encodeURIComponent(m.name)+'"><summary><span class="nm">'+esc(m.name)+'</span>'
       + (m.src==='poi'?'<span class="bad y">POI</span>':'')
       + '<span class="bad b">'+m.n+'单</span><span class="bad '+wc+'">整超'+last.w+'%</span><span class="bad '+pc+'">取超'+last.p+'%</span>'
       + (m.lng?'<button class="mapbtn" onclick="focusMap(\''+encodeURIComponent(m.name)+'\')">📍</button>':'')
       + '</summary>'
       + '<div class="body">'
       + '<h3>📅 按日超时率（8/15-22 · 每天 单量/整单超时/取餐段超时）</h3>'
       + '<div class="wrap"><table><tr><th>日期</th><th>单量</th><th>整单超时%</th><th>取餐段超时%</th></tr>'+dayRows+'</table></div>'
       + '<h3>📋 B端万服（'+m.wf_list.length+'件 · 点「链路」看订单）</h3>'
       + '<div class="wrap"><table><tr><th>时间</th><th>事件</th><th>骑手</th><th>详情</th></tr>'+wfRows+'</table></div>'
       + '<h3>📝 走访记录（自动保存本机）</h3>'
       + '<textarea class="visit" data-k="'+keyOf(m)+'" placeholder="记录走访情况…">'+esc(saved)+'</textarea>'
       + '<div style="margin-top:6px"><button class="vbtn" data-save="'+keyOf(m)+'">保存记录</button>'
       + '<button class="vbtn gy" data-clear="'+keyOf(m)+'">清空</button><span class="vstat"></span></div>'
       + '</div></details>';
  });
  document.getElementById('list').innerHTML=h || '<div class="empty">无匹配商家</div>';
  document.querySelectorAll('[data-save]').forEach(function(b){b.onclick=function(){
    var k=b.getAttribute('data-save');
    var v=document.querySelector('textarea[data-k="'+k+'"]').value;
    localStorage.setItem(k,v);
    b.parentNode.querySelector('.vstat').textContent='✓ 已保存 '+v.length+' 字';
  };});
  document.querySelectorAll('[data-clear]').forEach(function(b){b.onclick=function(){
    var k=b.getAttribute('data-clear');
    localStorage.removeItem(k);
    document.querySelector('textarea[data-k="'+k+'"]').value='';
    b.parentNode.querySelector('.vstat').textContent='已清空';
  };});
}
function gotoVisit(name){
  name=decodeURIComponent(name);
  switchTab('visit');
  var id='card_'+encodeURIComponent(name);
  var el=document.getElementById(id);
  if(el){ el.open=true; setTimeout(function(){el.scrollIntoView({behavior:'smooth',block:'start'});},60); }
  else { document.getElementById('q').value=name; q=name; renderVisit(); setTimeout(function(){var e2=document.getElementById(id); if(e2){e2.open=true;e2.scrollIntoView({behavior:'smooth'});}},100); }
}
function exportVisit(){
  var out=[],cnt=0;
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k.indexOf('bgvisit_')===0){var v=localStorage.getItem(k); if(v&&v.trim()){out.push('【'+k.replace('bgvisit_','')+'】\n'+v.trim());cnt++;}}
  }
  if(!cnt){alert('暂无走访记录');return;}
  var txt='贝岗村商家走访记录导出（'+new Date().toLocaleString()+'）\n共 '+cnt+' 家\n\n'+out.join('\n\n');
  var blob=new Blob(['\ufeff'+txt],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='贝岗村走访记录.txt';a.click();
}
// 顶部搜索（按当前视图）
document.getElementById('q').addEventListener('input',function(){
  q=this.value.trim();
  if(document.getElementById('mapView').style.display==='block') renderMap(q); else renderVisit();
});
document.getElementById('sub').textContent=D.dates+' · 贝岗商家 '+D.n_active+' 家 · 停业 '+D.n_closed+' 家';
document.getElementById('ft').textContent='整单超时=送达>预期送达 ｜ 取餐段超时=下单→取餐>20min ｜ 万服=B端进线 ｜ POI=近似定位待核实';
// URL ?m= 直达走访商家
(function(){
  var p=new URLSearchParams(location.search).get('m');
  if(p){ switchTab('visit'); setTimeout(function(){gotoVisit(p);},150); }
})();
renderVisit();
</script></body></html>
