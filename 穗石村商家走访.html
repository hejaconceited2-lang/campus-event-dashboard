<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>穗石村商家走访</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#f1f5f9;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;color:#0f172a}
.hd{position:sticky;top:0;background:#4f46e5;color:#fff;padding:12px 16px 8px;z-index:30}
.hd h1{font-size:18px;font-weight:800}
.hd .sub{font-size:11.5px;opacity:.85;margin-top:1px}
.tabs{display:flex;gap:8px;margin-top:9px}
.tab{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:rgba(255,255,255,.16);font-size:13.5px;font-weight:700}
.tab.on{background:#fff;color:#4f46e5}
.stabs{display:none;gap:6px;margin-top:7px;overflow-x:auto;padding-bottom:2px}
.stabs .s{flex:1;min-width:70px;padding:6px 0;border-radius:8px;background:rgba(255,255,255,.14);font-size:12px}
.stabs.on{display:flex}
.srch{margin:10px 16px 0;display:flex;gap:8px}
.srch input{flex:1;padding:9px 12px;border-radius:10px;border:1px solid #cbd5e1;font-size:14px;background:#fff}
.expbtn{margin:10px 16px 0;padding:9px 0;width:100%;border:none;border-radius:10px;background:#0d9488;color:#fff;font-size:13.5px;font-weight:700;cursor:pointer}
.expbtn.fix{background:#7c3aed}
.exprow{display:flex;gap:8px;margin:10px 16px 0}
.exprow .expbtn{flex:1;margin:0}
.fixrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.fixbtn{padding:6px 12px;border:none;border-radius:8px;background:#7c3aed;color:#fff;font-size:12px;font-weight:600;cursor:pointer}
.fixbtn.del{background:#e2e8f0;color:#475569}
.fixstat{font-size:11.5px;color:#7c3aed;font-weight:600}
.cnt{padding:10px 12px 60px}
.card{background:#fff;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(2,6,23,.07);overflow:hidden}
.card summary{list-style:none;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.card summary::-webkit-details-marker{display:none}
.card[open] summary{background:#f8fafc}
.nm{flex:1;font-weight:700;font-size:14px;line-height:1.35}
.bad{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.bad.r{background:#fee2e2;color:#b91c1c}.bad.y{background:#fef3c7;color:#b45309}.bad.g{background:#dcfce7;color:#15803d}.bad.b{background:#dbeafe;color:#1d4ed8}.bad.gy{background:#f1f5f9;color:#64748b}.bad.sd{background:#ede9fe;color:#6d28d9}
.body{padding:10px 14px 14px;border-top:1px solid #f1f5f9}
h3{font-size:13px;font-weight:700;margin:10px 0 6px;color:#334155}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th,td{padding:4px 5px;text-align:center;border-bottom:1px solid #f1f5f9;white-space:nowrap}
th{color:#64748b;font-weight:600}
.slow{color:#dc2626;font-weight:700}
.wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:8px}
.wfbtn{padding:2px 8px;border:none;border-radius:6px;background:#eef2ff;color:#4338ca;font-size:11px;cursor:pointer}
.mapbtn{padding:3px 9px;border:none;border-radius:8px;background:#eef2ff;color:#4f46e5;font-size:11.5px;font-weight:700;cursor:pointer}
.visit{width:100%;min-height:56px;border:1px solid #cbd5e1;border-radius:8px;padding:8px;font-size:13px;font-family:inherit;background:#fffbeb}
.vbtn{margin-top:6px;padding:6px 14px;border:none;border-radius:8px;background:#4f46e5;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
.vbtn.gy{background:#e2e8f0;color:#475569;margin-left:8px}
.vstat{font-size:11px;color:#16a34a;margin-top:4px}
.closed{margin-top:14px}
.closed summary{list-style:none;cursor:pointer;padding:10px;background:#fff;border-radius:10px;font-weight:600;color:#64748b}
#map{height:calc(100vh - 138px);margin:10px 12px;border-radius:14px;overflow:hidden;z-index:1}
#mapView{display:none}
.lgc{position:fixed;z-index:500;right:22px;bottom:80px;display:flex;flex-direction:column;gap:4px}
.lgc .b{padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer;border:1px solid #e2e8f0}
.pop{min-width:200px}
.pop h4{font-size:14px;margin-bottom:4px}
.pop .m{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px;margin:6px 0}
.pop .m b{display:block;font-size:14px}
.pop a{display:block;text-align:center;padding:6px;background:#4f46e5;color:#fff;border-radius:8px;text-decoration:none;font-size:12.5px;font-weight:600}
.legend{position:fixed;left:22px;bottom:14px;z-index:500;background:#fff;border-radius:9px;padding:6px 10px;font-size:11px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}
#modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:60;padding:12px;overflow:auto}
#modal .box{background:#fff;max-width:640px;margin:20px auto;border-radius:14px;padding:16px;position:relative}
#modal .close{position:absolute;right:12px;top:10px;border:none;background:#f1f5f9;font-size:15px;padding:4px 10px;border-radius:8px;cursor:pointer}
#mtl{font-size:12px}
.ft{color:#94a3b8;font-size:11px;text-align:center;margin-top:14px}
.empty{color:#94a3b8;text-align:center;padding:24px}
.drow{margin:8px 16px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dmode{display:flex;gap:4px;background:#eef2ff;border-radius:9px;padding:3px}
.dmode .dm{padding:5px 10px;border-radius:7px;font-size:12px;font-weight:700;color:#6366f1;cursor:pointer}
.dmode .dm.on{background:#4f46e5;color:#fff}
.dfold{margin-left:auto;display:flex;align-items:center;gap:5px;background:#fff;border:1.5px solid #4f46e5;border-radius:9px;padding:4px 10px;font-size:12px;font-weight:700;color:#4f46e5;cursor:pointer}
.dfold .arr{transition:transform .15s;display:inline-block}
.dfold.open .arr{transform:rotate(180deg)}
.dpanel{display:none;margin:6px 16px 0;padding:8px 10px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;flex-wrap:wrap;gap:6px}
.dpanel.open{display:flex}
.dchip{padding:4px 11px;border-radius:999px;border:1.5px solid #cbd5e1;background:#fff;font-size:12px;color:#64748b;cursor:pointer;font-weight:700}
.dchip.on{background:#059669;border-color:#059669;color:#fff}
.dsel{font-size:11px;color:#64748b;margin-left:auto}
.vday{border:1px solid #e2e8f0;border-radius:10px;padding:8px;margin-top:8px;background:#f8fafc}
.vday .vdt{font-size:12px;font-weight:700;color:#4f46e5;margin-bottom:4px}
.vday .visit{min-height:48px;background:#fff}
</style></head><body>
<div class="hd">
  <h1>🏘️ 穗石村商家走访</h1>
  <div class="sub" id="sub"></div>
  <div class="tabs">
    <div class="tab" id="tabMap">🗺️ 地图</div>
    <div class="tab on" id="tabVisit">📋 走访</div>
  </div>
  <div class="stabs on" id="stabs">
    <div class="tab s on" data-k="n">单量</div>
    <div class="tab s" data-k="w">整单超时</div>
    <div class="tab s" data-k="p">取餐超时</div>
    <div class="tab s" data-k="wf">B端万服</div>
  </div>
  <div class="drow">
    <div class="dmode">
      <div class="dm on" id="dmAll" onclick="setMode('all')">📊 整体</div>
      <div class="dm" id="dmOne" onclick="setMode('one')">📅 单日</div>
    </div>
    <div class="dfold" id="dfold" onclick="toggleFold()"><span id="dfoldL">📅 全周期</span><span class="arr">▾</span></div>
  </div>
  <div class="dpanel" id="dpanel"><div id="dchips" style="display:contents"></div></div>
</div>
<div class="srch"><input id="q" placeholder="🔍 搜索商家"></div>
<div id="mapView">
  <div id="map"></div>
  <div class="lgc">
    <div class="b" onclick="fitAll()">🌐 全部</div>
    <div class="b" onclick="fitCat('高')">🔴 高</div>
    <div class="b" onclick="fitCat('中')">🟡 中</div>
    <div class="b" onclick="fitCat('低')">🟢 低</div>
  </div>
  <div class="legend"><span><i style="background:#dc2626"></i>整超≥30%</span> <span><i style="background:#f59e0b"></i>15-30%</span> <span><i style="background:#22c55e"></i>&lt;15%</span> <span style="color:#64748b">所选日期合计</span></div>
</div>
<div id="visitView">
  <div class="exprow">
    <button class="expbtn" onclick="exportVisit()">📤 走访记录(.txt)</button>
    <button class="expbtn fix" onclick="exportFixes()">📌 定位修正(.csv)</button>
  </div>
  <div class="cnt" id="list"></div>
</div>
<div class="ft" id="ft"></div>
<div id="modal"><div class="box"><button class="close" onclick="closeM()">✕</button><h3 id="mt">订单链路</h3><div id="mtl">加载中…</div></div></div>

function dkey(s){

  return p.length===3?(parseInt(p[1],10)+'/'+parseInt(p[2],10)):String(s);
}
function selLabel(){
  var n=Object.keys(selDays).filter(function(k){return selDays[k];}).length;
  return n===1?'仅 '+Object.keys(selDays).filter(function(k){return selDays[k];})[0]
    : n===D.date_list.length?'全周期 '+D.date_list[0]+'~'+D.date_list[D.date_list.length-1]
    : '已选 '+n+' 天';
}

function setMode(mode){
  selMode=mode;
  document.getElementById('dmAll').classList.toggle('on', mode==='all');
  document.getElementById('dmOne').classList.toggle('on', mode==='one');
  if(mode==='one'){
    // 单日：只保留第一个已选日
    var first=D.date_list.filter(function(d){return selDays[d];})[0]||D.date_list[0];
    D.date_list.forEach(function(d){selDays[d]=(d===first);});
    document.getElementById('dpanel').classList.add('open'); // 单日模式自动展开便于选日
    document.getElementById('dfold').classList.add('open');
  }
  renderChips(); refreshAll();
}
function toggleDay(d){
  if(selMode==='one'){
    D.date_list.forEach(function(x){selDays[x]=(x===d);});
  } else {
    selDays[d]=!selDays[d];
    if(!D.date_list.some(function(x){return selDays[x];})) selDays[d]=true; // 至少保留一天
  }
  renderChips(); refreshAll();
}
function renderChips(){
  var el=document.getElementById('dchips'); el.innerHTML='';
  D.date_list.forEach(function(d){
    var c=document.createElement('div');
    c.className='dchip'+(selDays[d]?' on':'');
    c.textContent=(selDays[d]?'✓ ':'')+d;
    c.onclick=function(){toggleDay(d);};
    el.appendChild(c);
  });

}
// 按当前选择聚合商家：返回 {n, w, p, wf}（w/p 用超时单数精确重算，非简单平均）
function aggOf(m){
  var n=0, wh=0, pk=0, wf=0;
  m.days.forEach(function(dd){
    if(!selDays[dd.d]) return;
    n+=dd.n; wh+=dd.wh||0; pk+=dd.pk||0;
  });
  m.wf_list.forEach(function(w){
    var key=dkey(w[0]);
    if(selDays[key]) wf++;
  });
  return {n:n, w:n?Math.round(wh/n*1000)/10:null, p:n?Math.round(pk/n*1000)/10:null, wf:wf};
}

}

      +(m.sd?' <span class="bad sd">🛵自配送</span>':'')
      +'</h4>'
      +(m.src==='poi'?'<div style="font-size:11px;color:#b45309;margin-bottom:4px">📍 POI近似定位（走访时请核实）</div>':'')
      +'<div class="m"><div><b>'+a.n+'</b>单量</div><div><b>'+a.w+'%</b>整超(合计)</div><div><b>'+a.p+'%</b>取超(合计)</div><div><b>'+a.wf+'</b>B端万服</div></div>'
      +'<a href="#" onclick="gotoVisit(\''+encodeURIComponent(m.name)+'\');return false;">📋 去走访记录 →</a></div>');
    cluster.addLayer(mk);
  });
}
function fitAll(){ if(cluster&&cluster.getBounds().isValid()) map.fitBounds(cluster.getBounds().pad(0.15)); }
function fitCat(cat){
  var bs=[]; Object.keys(marksMap).forEach(function(n){var m=D.merchants.filter(function(x){return x.name===n;})[0]; if(m&&catOf(aggOf(m).w)===cat) bs.push(marksMap[n].getLatLng());});
  if(bs.length) map.fitBounds(L.latLngBounds(bs).pad(0.3));
}
function focusMap(name){
  name=decodeURIComponent(name);
  var fresh=!mapInit;
  switchTab('map');
  var m=D.merchants.filter(function(x){return x.name===name;})[0];
  if(!m||!m.lng){ alert('该商家无地图定位'); return; }
  if(!mapInit) initMap();
  setTimeout(function(){
    // 该商家可能被当前搜索过滤 → 清空搜索并全量重绘，确保标记存在
    if(!marksMap[name]){ document.getElementById('q').value=''; renderMap(''); }
    var mk=marksMap[name];
    if(!mk){ alert('该商家无地图定位'); return; }
    // 1) 先定位到商家（无论是否聚合都保证跳转）
    map.setView([m.lat,m.lng],17);
    var opened=false;
    var force=function(){
      if(opened) return; opened=true;
      // 若标记仍藏在聚合簇里（同坐标商家簇无法靠放大分开）：
      // 临时把该标记移出簇、单独加到地图上，再弹卡，保证一定能展开到具体商家
      var p=mk.__parent;
      if(p && p._icon && cluster.hasLayer(mk) && !map.hasLayer(mk)){
        try{ cluster.removeLayer(mk); }catch(e){}
        try{ map.addLayer(mk); }catch(e){}
      }
      mk.openPopup();
    };
    // 2) 标准展开：zoomToShowLayer 让标记可见（同坐标商家由 markercluster 自动 spiderfy 扇开）
    cluster.zoomToShowLayer(mk, force);
    // 3) 兜底：1.1s 后仍未弹出（簇展开卡住）→ 强制移出簇 + 弹卡
    setTimeout(force, 1100);
  }, fresh?550:80);
}

    // 走访记录：按日期隔离存储。单日=当天一个框；整体=已填写日期各一框（各日独立 key，互不混）

        +'<button class="vbtn gy" data-clear="'+k0+'">清空</button><span class="vstat"></span></div></div>';
    } else {

      var oldK=keyOf(m), oldV=localStorage.getItem(oldK);
      if(oldV&&oldV.trim()){
        recHtml+='<div class="vday"><div class="vdt">📝 历史记录（迁移前）</div>'
          +'<textarea class="visit" data-k="'+oldK+'" placeholder="…">'+esc(oldV)+'</textarea>'
          +'<div style="margin-top:6px"><button class="vbtn" data-save="'+oldK+'">保存记录</button>'
          +'<button class="vbtn gy" data-clear="'+oldK+'">清空</button><span class="vstat"></span></div></div>';
      }
      // 已填写日期各自一框（仅显示有内容的日期，避免空框刷屏）
      var filledD=selDates.filter(function(d){return (localStorage.getItem(visitKey(m,d))||'').trim();});
      recHtml+=filledD.map(function(d){
        var k=visitKey(m,d);
        return '<div class="vday"><div class="vdt">📝 '+d+' 走访记录</div>'
          +'<textarea class="visit" data-k="'+k+'" placeholder="…">'+esc(localStorage.getItem(k)||'')+'</textarea>'
          +'<div style="margin-top:6px"><button class="vbtn" data-save="'+k+'">保存记录</button>'
          +'<button class="vbtn gy" data-clear="'+k+'">清空</button><span class="vstat"></span></div></div>';
      }).join('');
      if(!recHtml) recHtml='<div style="color:#94a3b8;font-size:12px">暂无记录 · 切到📅单日可填写某天走访记录</div>';
      else recHtml+='<div style="color:#94a3b8;font-size:11px;margin-top:6px">💡 记录按日期分开存储；切到📅单日可新增其他日期记录</div>';
    }
    h += '<details class="card" id="card_'+encodeURIComponent(m.name)+'"><summary><span class="nm">'+esc(m.name)+'</span>'
       + (m.sd?'<span class="bad sd">🛵自配送</span>':'')
       + (m.src==='poi'?'<span class="bad y">POI</span>':'')
       + '<span class="bad b">'+a.n+'单</span><span class="bad '+wc+'">整超'+a.w+'%</span><span class="bad '+pc+'">取超'+a.p+'%</span>'
       + (m.lng?'<button class="mapbtn" onclick="focusMap(\''+encodeURIComponent(m.name)+'\')">📍</button>':'')
       + '</summary>'
       + '<div class="body">'
       + '<h3>📅 按日超时率明细（'+selLabel()+' · 每天 单量/整单超时/取餐段超时 · 头部为所选合计）</h3>'
       + '<div class="wrap"><table><tr><th>日期</th><th>单量</th><th>整单超时%</th><th>取餐段超时%</th></tr>'+dayRows+'</table></div>'
       + '<h3>📋 B端万服（'+a.wf+'件 · 点「链路」看订单）</h3>'
       + '<div class="wrap"><table><tr><th>时间</th><th>事件</th><th>骑手</th><th>详情</th></tr>'+wfRows+'</table></div>'
       + '<h3>📍 定位修正（站店门口点按钮抓 GPS，覆盖原 POI 坐标）</h3>'
       + '<div class="fixrow"><button class="fixbtn" data-fix="'+fixKey(m.name)+'">📌 抓取当前定位</button>'
       + '<button class="fixbtn del" data-fixdel="'+fixKey(m.name)+'">清除</button><span class="fixstat" id="fixstat_'+keyOf(m)+'"></span></div>'
       + '<h3>📝 走访记录（按日期分开保存）</h3>'
       + recHtml
       + '</div></details>';
  });
  document.getElementById('list').innerHTML=h || '<div class="empty">无匹配商家</div>';
  document.querySelectorAll('[data-save]').forEach(function(b){b.onclick=function(){
    var k=b.getAttribute('data-save');
    var v=document.querySelector('textarea[data-k="'+k+'"]').value;
    localStorage.setItem(k,v);
    b.parentNode.querySelector('.vstat').textContent='✓ 已保存 '+v.length+' 字';
  };});
  document.querySelectorAll('[data-clear]').forEach(function(b){b.onclick=function(){
    var k=b.getAttribute('data-clear');
    localStorage.removeItem(k);
    document.querySelector('textarea[data-k="'+k+'"]').value='';
    b.parentNode.querySelector('.vstat').textContent='已清空';
  };});
  document.querySelectorAll('[data-fix]').forEach(function(b){b.onclick=function(){
    var name=b.getAttribute('data-fix').replace('ssfix_','');
    grabFix(name);
  };});
  document.querySelectorAll('[data-fixdel]').forEach(function(b){b.onclick=function(){
    var name=b.getAttribute('data-fixdel').replace('ssfix_','');
    if(confirm('清除「'+name+'」的修正坐标？')) clearFix(name);
  };});
  renderFixStat();
}
function gotoVisit(name){

// ---- 定位修正：WGS84(GPS) → GCJ02(高德) ----
var _PI=Math.PI,_A=6378245.0,_EE=0.00669342162296594323;
function _outChina(lng,lat){return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271;}
function _tx(x,y){var r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*_PI)+20*Math.sin(2*x*_PI))*2/3;r+=(20*Math.sin(y*_PI)+40*Math.sin(y/3*_PI))*2/3;
  r+=(160*Math.sin(y/12*_PI)+320*Math.sin(y*_PI/30))*2/3;return r;}
function _tl(x,y){var r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*_PI)+20*Math.sin(2*x*_PI))*2/3;r+=(20*Math.sin(x*_PI)+40*Math.sin(x/3*_PI))*2/3;
  r+=(150*Math.sin(x/12*_PI)+300*Math.sin(x/30*_PI))*2/3;return r;}
function wgs2gcj(lng,lat){
  if(_outChina(lng,lat)) return [lng,lat];
  var dLat=_tx(lng-105,lat-35),dLng=_tl(lng-105,lat-35);
  var rl=lat/180*_PI,magic=Math.sin(rl);magic=1-_EE*magic*magic;var sm=Math.sqrt(magic);
  dLat=(dLat*180)/((_A*(1-_EE))/(magic*sm)*_PI);
  dLng=(dLng*180)/(_A/sm*Math.cos(rl)*_PI);
  return [lng+dLng,lat+dLat];
}
function fixKey(name){return 'ssfix_'+name;}
function getFix(name){try{return JSON.parse(localStorage.getItem(fixKey(name))||'null');}catch(e){return null;}}
function renderFixStat(){
  document.querySelectorAll('.fixstat').forEach(function(s){
    var name=s.id.replace('fixstat_ssvisit_','');
    var f=getFix(name);
    s.textContent=f?('✓ 已修正 '+f.lat.toFixed(5)+','+f.lng.toFixed(5)+'  @'+f.time+' (±'+f.acc+'m)'):'';
  });
}
function grabFix(name){
  if(!navigator.geolocation){alert('此浏览器不支持定位（需 HTTPS + 授权）');return;}
  var btn=document.querySelector('[data-fix="ssfix_'+name+'"]');
  if(btn){btn.disabled=true;btn.textContent='⏳ 定位中…';}
  navigator.geolocation.getCurrentPosition(function(pos){
    var g=wgs2gcj(pos.coords.longitude,pos.coords.latitude);
    var now=new Date(),p=function(n){return (n<10?'0':'')+n;};
    var rec={lng:+g[0].toFixed(6),lat:+g[1].toFixed(6),acc:Math.round(pos.coords.accuracy),time:p(now.getMonth()+1)+'-'+p(now.getDate())+' '+p(now.getHours())+':'+p(now.getMinutes())};
    localStorage.setItem(fixKey(name),JSON.stringify(rec));
    renderVisit();renderFixStat();
    alert('✅ 已保存修正坐标\n'+rec.lat+', '+rec.lng+'\n精度 ±'+rec.acc+'m @ '+rec.time+'\n\n可点「📌 定位修正(.csv)」导出');
  },function(err){
    var m=err.code===1?'定位权限被拒绝，请在浏览器/系统设置中允许定位':err.code===2?'定位失败（GPS信号弱，请到室外/窗边重试）':'定位超时，请重试';
    alert('⚠️ '+m);
    renderVisit();
  },{enableHighAccuracy:true,timeout:12000,maximumAge:0});
}
function clearFix(name){
  localStorage.removeItem(fixKey(name));
  renderVisit();
}
function exportFixes(){
  var out=[],cnt=0;
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k.indexOf('ssfix_')===0){
      var name=k.replace('ssfix_','');
      var f=getFix(name);
      if(f){out.push('【'+name+'】\n修正坐标: '+f.lat+','+f.lng+'（高德GCJ02）\n精度: ±'+f.acc+'m ｜ 时间: '+f.time);cnt++;}
    }
  }
  if(!cnt){alert('暂无定位修正记录');return;}
  var txt='穗石村商家定位修正导出（'+new Date().toLocaleString()+'）\n共 '+cnt+' 家\n坐标系: 高德GCJ02（可直接用于地图/定位表）\n\n'+out.join('\n\n');
  var blob=new Blob(['\ufeff'+txt],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='穗石村定位修正.txt';a.click();
}
function exportVisit(){
  var out=[],cnt=0;
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k.indexOf('ssvisit_')!==0) continue;
    var v=localStorage.getItem(k); if(!v||!v.trim()) continue;
    // key 结构：ssvisit_日期_商家名（新）或 ssvisit_商家名（旧历史）
    var rest=k.slice('ssvisit_'.length);
    var date=''; var name=rest;
    var us=rest.indexOf('_');
    if(us>0 && rest.slice(0,us).indexOf('/')>=0){ date=rest.slice(0,us); name=rest.slice(us+1); }
    out.push('【'+name+(date?' · '+date:' · 历史')+'】\n'+v.trim()); cnt++;
  }
  if(!cnt){alert('暂无走访记录');return;}
  var txt='穗石村商家走访记录导出（'+new Date().toLocaleString()+'）\n共 '+cnt+' 条\n\n'+out.join('\n\n');
  var blob=new Blob(['\ufeff'+txt],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='穗石村走访记录.txt';a.click();
}
